<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>题目库</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="nav">
    <div class="brand">问卷系统</div>
    <div class="links">
      <span class="user" id="user-chip" hidden><i id="user-initial">?</i><span id="who"></span></span>
      <a href="/dashboard.html">我的问卷</a>
      <a href="/bank.html" class="active">题目库</a>
      <a href="#" id="logout">退出</a>
    </div>
  </div>

  <div class="wrap wide">
    <div class="card">
      <div class="between">
        <div>
          <h2>题目库</h2>
          <p class="sub" style="margin-bottom:0">常用题目存这里，做问卷时直接选；改题会生成新版本，不影响已发布的问卷。</p>
        </div>
        <button class="primary" id="new-toggle">＋ 新建题目</button>
      </div>

      <!-- 新建题目表单 -->
      <div id="new-box" class="hidden" style="border-top:2px dashed var(--line-soft);padding-top:16px;margin-top:14px">
        <div class="row">
          <label class="field" style="width:160px">
            <span>题型</span>
            <select id="b-type">
              <option value="single">单选题</option>
              <option value="multiple">多选题</option>
              <option value="dropdown">下拉选择</option>
              <option value="rating">评分题（1~5 星）</option>
              <option value="text">文本填空</option>
              <option value="number">数字填空</option>
              <option value="date">日期</option>
            </select>
          </label>
          <label class="field grow">
            <span>题干</span>
            <input type="text" id="b-title" placeholder="例如：你的年龄" />
          </label>
        </div>
        <label class="field" id="b-options-box">
          <span>选项（每行一个）</span>
          <textarea id="b-options" placeholder="18 岁以下&#10;18~25 岁&#10;26~35 岁"></textarea>
        </label>
        <p class="small muted hidden" id="b-rating-hint">评分题固定为 1~5 星，无需配置选项。</p>
        <label class="row" style="gap:6px;margin-bottom:10px"><input type="checkbox" id="b-required" /> 必答题</label>
        <div class="row">
          <button class="primary" id="b-save">保存到题库</button>
          <button id="b-cancel">取消</button>
        </div>
        <div class="err hidden" id="b-msg"></div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="input-search">
          <input type="text" id="b-kw" placeholder="搜索题干或选项…" autocomplete="off" />
        </div>
        <div class="seg" id="scope-seg">
          <button data-scope="mine" class="on">我的题目</button>
          <button data-scope="shared">共享给我的</button>
        </div>
        <div class="grow"></div>
        <span class="muted small" id="b-count"></span>
      </div>
      <div id="list"><div class="skeleton"><i style="width:64%"></i><i style="width:44%"></i><i style="width:56%"></i></div></div>
    </div>
  </div>

  <!-- 版本历史弹窗 -->
  <div class="modal hidden" id="ver-modal">
    <div class="modal-box">
      <div class="between" style="margin-bottom:12px">
        <h3 style="margin:0">版本历史</h3>
        <button class="small" id="ver-close">✕</button>
      </div>
      <div id="ver-list"></div>
    </div>
  </div>

  <!-- 共享弹窗 -->
  <div class="modal hidden" id="share-modal">
    <div class="modal-box">
      <div class="between" style="margin-bottom:12px">
        <h3 style="margin:0">共享题目</h3>
        <button class="small" id="share-close">✕</button>
      </div>
      <p class="small muted" id="share-title"></p>
      <label class="field">
        <span>对方的用户名</span>
        <input type="text" id="share-user" placeholder="例如：bob" />
      </label>
      <div class="row">
        <button class="primary" id="share-ok">共享</button>
        <button class="danger" id="share-remove">取消共享</button>
      </div>
      <div class="err hidden" id="share-msg"></div>
      <div id="shared-list" class="small muted" style="margin-top:10px"></div>
    </div>
  </div>

  <!-- 修改题库题弹窗：保存后生成新版本，历史全部保留 -->
  <div class="modal hidden" id="edit-modal">
    <div class="modal-box" style="max-width:560px">
      <div class="between" style="margin-bottom:12px">
        <h3 style="margin:0">修改题目（生成新版本）</h3>
        <button class="small" id="edit-close">✕</button>
      </div>
      <p class="small muted" id="edit-hint"></p>
      <div class="row">
        <label class="field" style="width:160px">
          <span>题型</span>
          <select id="e-type">
            <option value="single">单选题</option>
            <option value="multiple">多选题</option>
            <option value="dropdown">下拉选择</option>
            <option value="rating">评分题（1~5 星）</option>
            <option value="text">文本填空</option>
            <option value="number">数字填空</option>
            <option value="date">日期</option>
          </select>
        </label>
        <label class="field grow">
          <span>题干</span>
          <input type="text" id="e-title" />
        </label>
      </div>
      <label class="field" id="e-options-box">
        <span>选项（每行一个，可写成「A. 学生」，也可只写文字）</span>
        <textarea id="e-options"></textarea>
      </label>
      <p class="small muted hidden" id="e-rating-hint">评分题固定为 1~5 星，无需配置选项。</p>
      <label class="row" style="gap:6px;margin-bottom:10px"><input type="checkbox" id="e-required" /> 必答题</label>
      <div class="row">
        <button class="primary" id="e-save">保存为新版本</button>
        <button id="e-cancel">取消</button>
      </div>
      <div class="err hidden" id="e-msg"></div>
    </div>
  </div>

  <!-- 使用情况弹窗 -->
  <div class="modal hidden" id="usage-modal">
    <div class="modal-box">
      <div class="between" style="margin-bottom:12px">
        <h3 style="margin:0">被哪些问卷使用</h3>
        <button class="small" id="usage-close">✕</button>
      </div>
      <div id="usage-list"></div>
    </div>
  </div>

  <!-- 单题跨问卷统计弹窗 -->
  <div class="modal hidden" id="stat-modal">
    <div class="modal-box" style="max-width:560px">
      <div class="between" style="margin-bottom:12px">
        <h3 style="margin:0">跨问卷统计</h3>
        <button class="small" id="stat-close">✕</button>
      </div>
      <div id="stat-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const { Auth, api, esc, toast, fmtTime } = App;
    if (!Auth.requireLogin()) throw new Error('redirect');
    const me = Auth.user() || {};
    document.getElementById('who').textContent = me.username || '';
    document.getElementById('user-initial').textContent = (me.username || '?').slice(0, 1).toUpperCase();
    document.getElementById('user-chip').hidden = false;
    document.getElementById('logout').onclick = (e) => {
      e.preventDefault();
      Auth.clear();
      location.href = '/index.html';
    };

    const typeLabel = {
      single: '单选题', multiple: '多选题', text: '文本填空', number: '数字填空',
      dropdown: '下拉选择', rating: '评分题', date: '日期题',
    };

    let scope = 'mine';
    let shareTargetId = null;
    let bankList = [];

    function parseOptions(text) {
      return text.split('\n').map((s) => s.trim()).filter(Boolean)
        .map((line, i) => {
          const m = line.match(/^([A-Za-z])[.、)．]\s*(.+)$/);
          if (m) return { key: m[1].toUpperCase(), label: m[2].trim() };
          return { key: String.fromCharCode(65 + i), label: line };
        });
    }

    function setTab(next) {
      scope = next;
      document.querySelectorAll('#scope-seg button').forEach((b) => b.classList.toggle('on', b.dataset.scope === next));
      load();
    }
    document.getElementById('scope-seg').onclick = (e) => {
      const btn = e.target.closest('button[data-scope]');
      if (btn) setTab(btn.dataset.scope);
    };
    // 题库一次全量取回，搜索在前端过滤即可（不额外打接口）
    document.getElementById('b-kw').oninput = () => load();

    // ── 新建题目 ──
    const newBox = document.getElementById('new-box');
    document.getElementById('new-toggle').onclick = () => newBox.classList.toggle('hidden');
    document.getElementById('b-cancel').onclick = () => newBox.classList.add('hidden');
    document.getElementById('b-type').onchange = () => {
      const t = document.getElementById('b-type').value;
      const withOptions = ['single', 'multiple', 'dropdown'].includes(t);
      document.getElementById('b-options-box').classList.toggle('hidden', !withOptions);
      document.getElementById('b-rating-hint').classList.toggle('hidden', t !== 'rating');
    };
    document.getElementById('b-save').onclick = async () => {
      const msg = document.getElementById('b-msg');
      msg.classList.add('hidden');
      const t = document.getElementById('b-type').value;
      const body = { type: t, title: document.getElementById('b-title').value, required: document.getElementById('b-required').checked };
      if (['single', 'multiple', 'dropdown'].includes(t)) body.options = parseOptions(document.getElementById('b-options').value);
      try {
        await api('/bank-questions', { method: 'POST', body });
        document.getElementById('b-title').value = '';
        document.getElementById('b-options').value = '';
        newBox.classList.add('hidden');
        toast('已保存到题库');
        load();
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove('hidden');
      }
    };

    // ── 列表 ──
    async function load() {
      const box = document.getElementById('list');
      const kw = document.getElementById('b-kw').value.trim().toLowerCase();
      try {
        const data = await api('/bank-questions?scope=' + scope);
        bankList = data.questions;
        const visible = kw
          ? bankList.filter((q) =>
              (q.title + ' ' + (q.options || []).map((o) => o.label).join(' ')).toLowerCase().includes(kw)
            )
          : bankList;
        document.getElementById('b-count').textContent = visible.length ? '共 ' + visible.length + ' 道题' : '';

        if (!visible.length) {
          box.innerHTML = kw
            ? '<div class="empty">没有匹配「' + esc(kw) + '」的题目<br /><span class="small">换个关键词试试</span></div>'
            : scope === 'mine'
              ? '<div class="empty">题库还是空的<br /><span class="small">点「新建题目」，或在问卷编辑页把常用题「存为常用题」</span></div>'
              : '<div class="empty">还没有人共享题目给你<br /><span class="small">队友在题目库点「共享」并输入你的用户名即可</span></div>';
          return;
        }

        box.innerHTML = visible
          .map((q) => {
            const opts =
              q.type === 'rating'
                ? '固定选项：1 星 ~ 5 星'
                : q.options && q.options.length
                  ? q.options.map((o) => esc(o.key + '. ' + o.label)).join('　')
                  : '无选项';
            const tag = [typeLabel[q.type], q.required ? '必答' : '', q.is_shared_to_me ? '来自 ' + (q.owner_username || '他人') : '']
              .filter(Boolean)
              .join(' · ');
            const moreItems = q.is_owner
              ? '<button data-act="share" data-id="' + q.id + '" data-title="' + esc(q.title) + '">共享给他人</button>' +
                '<button data-act="usage" data-id="' + q.id + '">使用情况</button>' +
                '<button data-act="stats" data-id="' + q.id + '">跨问卷统计</button>' +
                '<div class="sep"></div>' +
                '<button data-act="fork" data-id="' + q.id + '">复制为新题</button>'
              : '';
            return `
          <div class="list-item">
            <div class="grow">
              <div class="title"><span class="tag">v${q.version}</span> ${esc(q.title)}
                <span class="small muted" style="font-weight:400">${tag}</span></div>
              <div class="small muted" style="margin-top:2px">${opts}</div>
              <div class="meta"><span>更新于 ${fmtTime(q.updated_at)}</span></div>
            </div>
            <div class="ops">
              ${
                q.is_owner
                  ? '<button class="small main" data-act="edit" data-id="' + q.id + '">修改（新版本）</button>'
                  : '<button class="small main" data-act="fork" data-id="' + q.id + '">加到我的题库</button>'
              }
              <button class="small" data-act="versions" data-id="${q.id}">版本历史</button>
              ${q.is_owner ? '<div class="more"><button class="small">更多 ▾</button><div class="more-list">' + moreItems + '</div></div>' : ''}
            </div>
          </div>`;
          })
          .join('');

        box.querySelectorAll('[data-act]').forEach((btn) => {
          btn.onclick = () => act(btn.dataset.act, btn.dataset.id, btn.dataset.title);
        });
      } catch (err) {
        box.innerHTML = '<p class="err">' + esc(err.message) + '</p>';
      }
    }

    async function act(name, qid, title) {
      if (name === 'versions') return showVersions(qid);
      if (name === 'share') return showShare(qid, title);
      if (name === 'usage') return showUsage(qid);
      if (name === 'stats') return showStats(qid);
      if (name === 'fork') {
        try {
          await api('/bank-questions/' + qid + '/fork', { method: 'POST' });
          toast('已复制到我的题库（新题目 v1）');
          setTab('mine');
        } catch (err) { toast(err.message); }
      }
      if (name === 'edit') return openEdit(qid);
    }

    // ── 修改题目（生成新版本）──
    let editingBankId = null;

    function optionsToText(options) {
      return (options || []).map((o) => o.key + '. ' + o.label).join('\n');
    }

    function toggleEditTypeFields() {
      const t = document.getElementById('e-type').value;
      document.getElementById('e-options-box').classList.toggle('hidden', !['single', 'multiple', 'dropdown'].includes(t));
      document.getElementById('e-rating-hint').classList.toggle('hidden', t !== 'rating');
    }
    document.getElementById('e-type').onchange = toggleEditTypeFields;

    function openEdit(qid) {
      const q = bankList.find((x) => x.id === qid);
      if (!q) return;
      editingBankId = qid;
      document.getElementById('edit-hint').textContent =
        '当前 v' + q.version + '，保存后生成 v' + (q.version + 1) + '；历史版本全部保留，已引用旧版本的问卷不受影响。';
      document.getElementById('e-type').value = q.type;
      document.getElementById('e-title').value = q.title;
      document.getElementById('e-required').checked = Boolean(q.required);
      document.getElementById('e-options').value = optionsToText(q.options);
      document.getElementById('e-msg').classList.add('hidden');
      toggleEditTypeFields();
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    document.getElementById('e-save').onclick = async () => {
      const msg = document.getElementById('e-msg');
      msg.classList.add('hidden');
      const type = document.getElementById('e-type').value;
      const body = {
        type,
        title: document.getElementById('e-title').value,
        required: document.getElementById('e-required').checked,
      };
      if (['single', 'multiple', 'dropdown'].includes(type)) {
        body.options = parseOptions(document.getElementById('e-options').value);
      }
      try {
        await api('/bank-questions/' + editingBankId, { method: 'PUT', body });
        document.getElementById('edit-modal').classList.add('hidden');
        toast('已生成新版本');
        load();
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove('hidden');
      }
    };
    document.getElementById('e-cancel').onclick = () => document.getElementById('edit-modal').classList.add('hidden');
    document.getElementById('edit-close').onclick = () => document.getElementById('edit-modal').classList.add('hidden');

    // ── 版本历史 ──
    async function showVersions(qid) {
      const modal = document.getElementById('ver-modal');
      const list = document.getElementById('ver-list');
      list.innerHTML = '<p class="muted">加载中…</p>';
      modal.classList.remove('hidden');
      try {
        const data = await api('/bank-questions/' + qid + '/versions');
        list.innerHTML = data.versions
          .map((v) => {
            const mine = v.is_owner;
            return `
            <div class="list-item">
              <div class="grow">
                <div class="title"><span class="tag">v${v.version}</span> <strong>${esc(v.title)}</strong>
                  ${v.version === data.latest_version ? '<span class="small muted">（最新）</span>' : ''}</div>
                <div class="small muted">${
                  v.type === 'rating' ? '1~5 星' : v.options && v.options.length ? v.options.map((o) => esc(o.label)).join(' / ') : '无选项'
                }</div>
                ${v.parent_id ? '<div class="small muted">修改自 v' + versionOf(data.versions, v.parent_id) + '</div>' : '<div class="small muted">原始版本</div>'}
              </div>
              ${mine && v.version !== data.latest_version
                ? '<button class="small" data-revert="' + v.version + '">恢复此版本</button>'
                : ''}
            </div>`;
          })
          .join('');
        list.querySelectorAll('[data-revert]').forEach((b) => {
          b.onclick = async () => {
            if (!confirm('以 v' + b.dataset.revert + ' 的内容生成一个新版本？（不会删除任何历史）')) return;
            try {
              await api('/bank-questions/' + qid + '/revert', { method: 'POST', body: { version: Number(b.dataset.revert) } });
              toast('已恢复为最新版本');
              modal.classList.add('hidden');
              load();
            } catch (err) { toast(err.message); }
          };
        });
      } catch (err) {
        list.innerHTML = '<p class="err">' + esc(err.message) + '</p>';
      }
    }
    function versionOf(versions, id) {
      const v = versions.find((x) => x.id === id);
      return v ? v.version : '?';
    }

    // ── 共享 ──
    async function showShare(qid, title) {
      shareTargetId = qid;
      document.getElementById('share-title').textContent = '「' + title + '」——共享后对方可在自己的问卷里选用（对方不能改你的题）';
      document.getElementById('share-user').value = '';
      document.getElementById('share-msg').classList.add('hidden');
      document.getElementById('shared-list').textContent = '';
      document.getElementById('share-modal').classList.remove('hidden');
      // 展示版本树（共享是整棵树生效）
      try {
        const data = await api('/bank-questions/' + qid + '/versions');
        document.getElementById('shared-list').textContent = '该题共 ' + data.versions.length + ' 个版本，共享对整棵版本树生效。';
      } catch (_) { /* 忽略 */ }
    }
    document.getElementById('share-ok').onclick = async () => {
      const msg = document.getElementById('share-msg');
      msg.classList.add('hidden');
      try {
        const res = await api('/bank-questions/' + shareTargetId + '/share', {
          method: 'POST',
          body: { username: document.getElementById('share-user').value },
        });
        toast('已共享给 ' + res.username);
        document.getElementById('share-modal').classList.add('hidden');
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove('hidden');
      }
    };
    document.getElementById('share-remove').onclick = async () => {
      const msg = document.getElementById('share-msg');
      msg.classList.add('hidden');
      try {
        await api('/bank-questions/' + shareTargetId + '/unshare', {
          method: 'POST',
          body: { username: document.getElementById('share-user').value },
        });
        toast('已取消共享');
        document.getElementById('share-modal').classList.add('hidden');
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove('hidden');
      }
    };

    // ── 使用情况 ──
    async function showUsage(qid) {
      const modal = document.getElementById('usage-modal');
      const list = document.getElementById('usage-list');
      list.innerHTML = '<p class="muted">加载中…</p>';
      modal.classList.remove('hidden');
      try {
        const data = await api('/bank-questions/' + qid + '/usage');
        list.innerHTML = data.surveys.length
          ? '<p class="small muted">被 ' + data.survey_count + ' 份问卷使用：</p>' +
            data.surveys
              .map(
                (s) => `
              <div class="list-item">
                <div class="grow">
                  <div class="title"><strong>${esc(s.title)}</strong></div>
                  <div class="small muted">创建于 ${fmtTime(s.created_at)} · 使用版本 v${s.used_versions.map((u) => u.bank_version).join('、v')}</div>
                </div>
              </div>`
              )
              .join('')
          : '<p class="muted">还没有问卷使用这道题。</p>';
      } catch (err) {
        list.innerHTML = '<p class="err">' + esc(err.message) + '</p>';
      }
    }

    // ── 跨问卷统计 ──
    async function showStats(qid) {
      const modal = document.getElementById('stat-modal');
      const body = document.getElementById('stat-body');
      body.innerHTML = '<p class="muted">加载中…</p>';
      modal.classList.remove('hidden');
      try {
        const s = await api('/bank-questions/' + qid + '/stats');
        let html =
          '<p class="small muted"><strong>' + esc(s.question.title) + '</strong> · ' + typeLabel[s.question.type] +
          ' · 被引用 ' + s.survey_count + ' 份问卷 · ' + s.response_count + ' 人作答</p>';
        if (s.option_counts && s.option_counts.length) {
          const max = Math.max(...s.option_counts.map((o) => o.count));
          html += s.option_counts
            .map(
              (o) => `
            <div style="margin:10px 0">
              <div class="small">${esc(o.key + '. ' + o.label)} —— ${o.count} 次</div>
              <div style="height:14px;background:#ddd;border:2px solid #1a1c2c;margin-top:4px">
                <div style="height:100%;width:${max ? Math.round((o.count / max) * 100) : 0}%;background:#3b5dc9"></div>
              </div>
            </div>`
            )
            .join('');
        }
        if (s.number_stats) {
          html += '<p class="small">共 ' + s.number_stats.count + ' 人作答：最小 ' + s.number_stats.min +
            ' · 最大 ' + s.number_stats.max + ' · 平均 ' + s.number_stats.avg + '</p>';
        }
        if (s.text_stats) {
          html += '<p class="small">共 ' + s.text_stats.count + ' 条回答' +
            (s.text_stats.samples.length ? '，最近样本：' : '') + '</p>' +
            '<ul class="small">' + s.text_stats.samples.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>';
        }
        if (s.date_counts && s.date_counts.length) {
          html += '<p class="small">按日期分布：</p><ul class="small">' +
            s.date_counts.map((d) => '<li>' + esc(d.date) + ' —— ' + d.count + ' 次</li>').join('') + '</ul>';
        }
        if (!s.option_counts.length && !s.number_stats && !s.text_stats && !(s.date_counts || []).length) {
          html += '<p class="muted">还没有作答数据。</p>';
        }
        body.innerHTML = html;
      } catch (err) {
        body.innerHTML = '<p class="err">' + esc(err.message) + '</p>';
      }
    }

    // 弹窗点击遮罩关闭
    ['ver-modal', 'share-modal', 'usage-modal', 'stat-modal', 'edit-modal'].forEach((m) => {
      document.getElementById(m).onclick = (e) => {
        if (e.target.id === m) e.target.classList.add('hidden');
      };
    });
    document.getElementById('ver-close').onclick = () => document.getElementById('ver-modal').classList.add('hidden');
    document.getElementById('share-close').onclick = () => document.getElementById('share-modal').classList.add('hidden');
    document.getElementById('usage-close').onclick = () => document.getElementById('usage-modal').classList.add('hidden');
    document.getElementById('stat-close').onclick = () => document.getElementById('stat-modal').classList.add('hidden');

    load();
  </script>
</body>
</html>
