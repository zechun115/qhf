<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的问卷</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="nav">
    <div class="brand">问卷系统</div>
    <div class="links">
      <span class="who" id="who"></span>
      <a href="/dashboard.html">我的问卷</a>
      <a href="#" id="logout">退出</a>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="between">
        <div>
          <h2>我的问卷</h2>
          <p class="sub">在这里创建问卷、发布链接、查看统计</p>
        </div>
        <button class="primary" id="create-btn">新建问卷</button>
      </div>

      <div id="create-box" class="hidden" style="border-top:1px solid var(--line);padding-top:16px;margin-top:4px">
        <label class="field">
          <span>问卷标题</span>
          <input type="text" id="new-title" placeholder="例如：课程反馈调查" />
        </label>
        <label class="field">
          <span>问卷说明（可选）</span>
          <textarea id="new-desc" placeholder="向填写者说明问卷目的"></textarea>
        </label>
        <div class="row" style="margin-bottom:12px">
          <label class="row" style="gap:6px"><input type="checkbox" id="new-anon" /> 允许匿名填写（不登录也能填）</label>
          <label class="row" style="gap:6px"><input type="checkbox" id="new-multi" checked /> 允许同一人多次填写</label>
        </div>
        <div class="row">
          <button class="primary" id="create-ok">创建</button>
          <button id="create-cancel">取消</button>
        </div>
        <div class="err hidden" id="create-msg"></div>
      </div>
    </div>

    <div class="card">
      <div class="between" style="margin-bottom:12px">
        <div class="row">
          <select id="status-filter" style="width:140px">
            <option value="">全部状态</option>
            <option value="draft">草稿</option>
            <option value="published">已发布</option>
            <option value="closed">已关闭</option>
          </select>
        </div>
        <span class="muted small" id="total"></span>
      </div>
      <div id="list"><p class="muted">加载中…</p></div>
    </div>
  </div>

  <!-- 二维码弹窗：展示填写链接的扫码入口 -->
  <div class="modal hidden" id="qr-modal">
    <div class="modal-box">
      <div class="between" style="margin-bottom:12px">
        <h3 style="margin:0">扫码填写</h3>
        <button class="small" id="qr-close">✕</button>
      </div>
      <p class="small muted" id="qr-title"></p>
      <div class="qr-wrap"><img id="qr-img" alt="问卷填写二维码" /></div>
      <p class="small mono" id="qr-url" style="word-break:break-all;margin-top:10px"></p>
      <p class="small muted">手机扫码或访问上方链接即可填写，无需登录（若问卷允许匿名）。</p>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const { Auth, api, esc, fmtTime, statusTag } = App;
    if (!Auth.requireLogin()) throw new Error('redirect');
    document.getElementById('who').textContent = (Auth.user() || {}).username || '';

    document.getElementById('logout').onclick = (e) => {
      e.preventDefault();
      Auth.clear();
      location.href = '/index.html';
    };

    const createBox = document.getElementById('create-box');
    document.getElementById('create-btn').onclick = () => createBox.classList.toggle('hidden');
    document.getElementById('create-cancel').onclick = () => createBox.classList.add('hidden');

    document.getElementById('create-ok').onclick = async () => {
      const msg = document.getElementById('create-msg');
      msg.classList.add('hidden');
      try {
        const data = await api('/surveys', {
          method: 'POST',
          body: {
            title: document.getElementById('new-title').value,
            description: document.getElementById('new-desc').value,
            allow_anonymous: document.getElementById('new-anon').checked,
            allow_multiple: document.getElementById('new-multi').checked,
          },
        });
        location.href = '/edit.html?id=' + data.survey.id;
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove('hidden');
      }
    };

    async function load() {
      const status = document.getElementById('status-filter').value;
      const box = document.getElementById('list');
      try {
        const data = await api('/surveys?size=50' + (status ? '&status=' + status : ''));
        document.getElementById('total').textContent = '共 ' + data.total + ' 份';
        if (!data.items.length) {
          box.innerHTML = '<p class="muted">还没有问卷，点右上角「新建问卷」开始。</p>';
          return;
        }
        box.innerHTML = data.items
          .map(
            (s) => `
          <div class="list-item">
            <div class="grow">
              <div class="title">${esc(s.title)} ${statusTag(s.status)}</div>
              <div class="small muted">
                ${s.question_count} 题 · ${s.response_count} 份答卷 · 创建于 ${fmtTime(s.created_at)}
                ${s.deadline ? ' · 截止 ' + fmtTime(s.deadline) : ''}
              </div>
              <div class="small mono" style="margin-top:4px">${esc(s.share_url)}</div>
            </div>
            <div class="row" style="gap:6px">
              <button class="small" data-act="copy" data-url="${esc(s.share_url)}">复制链接</button>
              <button class="small" data-act="qrcode" data-id="${s.id}" data-title="${esc(s.title)}" ${s.status === 'published' ? '' : 'disabled'}>二维码</button>
              <button class="small" data-act="dup" data-id="${s.id}" data-title="${esc(s.title)}">复制问卷</button>
              <button class="small" data-act="export" data-id="${s.id}" ${s.response_count ? '' : 'disabled'}>导出答卷</button>
              <a class="small" href="/stats.html?id=${s.id}"><button class="small">统计</button></a>
              <a class="small" href="/edit.html?id=${s.id}"><button class="small">编辑</button></a>
            </div>
          </div>`
          )
          .join('');

        box.querySelectorAll('[data-act="copy"]').forEach((btn) => {
          btn.onclick = () => App.copy(btn.dataset.url);
        });
        box.querySelectorAll('[data-act="dup"]').forEach((btn) => {
          btn.onclick = async () => {
            if (!confirm('复制「' + btn.dataset.title + '」为一份新草稿问卷？')) return;
            try {
              const res = await api('/surveys/' + btn.dataset.id + '/duplicate', { method: 'POST' });
              toast('已创建副本，共复制 ' + res.copied_questions + ' 道题');
              load();
            } catch (err) {
              alert(err.message);
            }
          };
        });
        box.querySelectorAll('[data-act="qrcode"]').forEach((btn) => {
          btn.onclick = async () => {
            const modal = document.getElementById('qr-modal');
            document.getElementById('qr-title').textContent = '「' + btn.dataset.title + '」';
            document.getElementById('qr-img').src = '';
            document.getElementById('qr-url').textContent = '生成中…';
            modal.classList.remove('hidden');
            try {
              const res = await api('/surveys/' + btn.dataset.id + '/qrcode');
              document.getElementById('qr-img').src = res.qr_data_url;
              document.getElementById('qr-url').textContent = res.fill_url;
            } catch (err) {
              document.getElementById('qr-url').textContent = err.message;
            }
          };
        });
        document.getElementById('qr-close').onclick = () => document.getElementById('qr-modal').classList.add('hidden');
        document.getElementById('qr-modal').onclick = (e) => {
          if (e.target.id === 'qr-modal') e.target.classList.add('hidden');
        };
        box.querySelectorAll('[data-act="export"]').forEach((btn) => {
          btn.onclick = () => exportCsv(btn.dataset.id);
        });
      } catch (err) {
        box.innerHTML = '<p class="err">' + esc(err.message) + '</p>';
      }
    }

    /** 导出答卷 CSV：带 Authorization 头的下载只能用 fetch + blob 实现（浏览器下载链接无法带令牌） */
    async function exportCsv(surveyId) {
      try {
        const res = await fetch('/api/surveys/' + surveyId + '/responses/export', {
          headers: { Authorization: 'Bearer ' + Auth.token() },
        });
        if (!res.ok) throw new Error('导出失败（HTTP ' + res.status + '）');
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '答卷-' + surveyId.slice(-6) + '.csv';
        a.click();
        URL.revokeObjectURL(a.href);
        toast('答卷已导出');
      } catch (err) {
        alert(err.message);
      }
    }

    document.getElementById('status-filter').onchange = load;
    load();
  </script>
</body>
</html>
