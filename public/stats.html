<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>统计结果</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="nav">
    <div class="brand">问卷系统</div>
    <div class="links">
      <span class="user" id="user-chip" hidden><i id="user-initial">?</i><span id="who"></span></span>
      <a href="/dashboard.html" class="active">我的问卷</a>
      <a href="/bank.html">题目库</a>
      <a href="#" id="logout">退出</a>
    </div>
  </div>

  <div class="wrap wide">
    <div class="card">
      <div class="between">
        <div>
          <h2 id="title">加载中…</h2>
          <p class="sub" id="meta" style="margin-bottom:0"></p>
        </div>
        <div class="row">
          <a id="edit-link"><button class="small">返回编辑</button></a>
          <button class="small" id="export-btn">导出答卷 CSV</button>
          <button class="small primary" id="refresh">刷新</button>
        </div>
      </div>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="k">总答卷数</div>
        <div class="v" id="stat-total">0</div>
        <div class="d">已提交的答卷</div>
      </div>
      <div class="metric ok">
        <div class="k">匿名答卷</div>
        <div class="v" id="stat-anon">0</div>
        <div class="d">未登录直接填写</div>
      </div>
      <div class="metric accent">
        <div class="k">登录答卷</div>
        <div class="v" id="stat-login">0</div>
        <div class="d">登录账号后填写</div>
      </div>
      <div class="metric warn">
        <div class="k">题目数</div>
        <div class="v" id="stat-questions">0</div>
        <div class="d">参与统计的题目</div>
      </div>
    </div>

    <div id="stats"><p class="muted">加载中…</p></div>

    <div class="card" style="margin-top:22px">
      <div class="between">
        <h2>答卷明细</h2>
        <button class="small" id="load-responses">加载最近 20 份</button>
      </div>
      <div id="responses" style="margin-top:12px"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const { Auth, api, esc, toast, fmtTime } = App;
    if (!Auth.requireLogin()) throw new Error('redirect');

    const me = Auth.user() || {};
    document.getElementById('who').textContent = me.username || '';
    document.getElementById('user-initial').textContent = (me.username || '?').slice(0, 1).toUpperCase();
    document.getElementById('user-chip').hidden = false;

    const id = App.query('id');
    let data = null;

    document.getElementById('logout').onclick = (e) => {
      e.preventDefault();
      Auth.clear();
      location.href = '/index.html';
    };
    document.getElementById('edit-link').href = '/edit.html?id=' + id;

    function bars(question) {
      const isRating = question.type === 'rating';
      return question.options
        .map(
          (o) => `
        <div class="bar-row">
          <div class="small">${isRating ? '★'.repeat(Number(o.key)) + ' ' + esc(o.label) : esc(o.key + '. ' + o.label)}</div>
          <div class="bar"><i style="width:${o.percent}%"></i></div>
          <div class="small muted">${o.count} 人 · ${o.percent}%</div>
        </div>`
        )
        .join('');
    }

    function renderStats() {
      document.getElementById('title').textContent = data.survey.title;
      const setNum = (id, n) => {
        const el = document.getElementById(id);
        el.textContent = n;
        el.classList.toggle('zero', Number(n) === 0);
      };
      setNum('stat-total', data.total_responses);
      setNum('stat-anon', data.anonymous_responses);
      setNum('stat-login', data.logged_in_responses);
      setNum('stat-questions', data.questions.length);
      document.getElementById('meta').textContent =
        '共 ' + data.questions.length + ' 题 · 统计基于已提交的 ' + data.total_responses + ' 份答卷';

      const box = document.getElementById('stats');
      if (!data.total_responses) {
        box.innerHTML =
          '<div class="card"><div class="empty">还没有答卷<br />' +
          '<span class="small">把填写链接或二维码发给别人，收到第一份后这里会自动出现统计</span></div></div>';
        return;
      }

      box.innerHTML =
        '<div class="stat-grid">' +
        data.questions
          .map((q) => {
            // 文本与日期题内容多，占满整行；选项与数字题两列并排，减少滚动
            const wide = ['text', 'date'].includes(q.type);
            let inner = '';
            if (['single', 'multiple', 'dropdown', 'rating'].includes(q.type)) {
              inner = bars(q);
            } else if (q.type === 'text') {
              inner =
                '<p class="small muted" style="margin:0 0 6px">共 ' + q.text_count + ' 条，平均 ' + q.avg_length + ' 字</p>' +
                '<div style="max-height:220px;overflow:auto">' +
                q.texts.map((t) => '<div class="small" style="padding:5px 0;border-bottom:1px dashed var(--line-soft)">' + esc(t) + '</div>').join('') +
                (q.texts_truncated ? '<p class="small muted">仅显示前 100 条</p>' : '') +
                '</div>';
            } else if (q.type === 'date') {
              inner =
                '<p class="small muted" style="margin:0 0 6px">共 ' + q.date_count + ' 份作答，出现的日期（新→旧）：</p>' +
                '<div class="row" style="flex-wrap:wrap;gap:6px">' +
                (q.dates || []).map((d) => '<span class="tag mono">' + esc(d) + '</span>').join('') +
                '</div>' +
                (q.dates_truncated ? '<p class="small muted">仅显示最近 50 个日期</p>' : '');
            } else {
              // 数字题：给出区间与均值位置，比只列三个数字更容易判断分布靠哪边
              const span = Number(q.max) - Number(q.min);
              const pos = span > 0 ? Math.min(100, Math.max(0, ((Number(q.avg) - Number(q.min)) / span) * 100)) : 50;
              inner =
                '<div class="row" style="gap:16px;margin-bottom:8px">' +
                '<span class="small">平均 <b>' + q.avg + '</b></span>' +
                '<span class="small muted">最小 ' + q.min + '</span>' +
                '<span class="small muted">最大 ' + q.max + '</span>' +
                '</div>' +
                '<div class="bar" style="height:20px"><i style="width:' + pos + '%"></i></div>' +
                '<div class="hist-axis" style="margin-top:4px"><span>' + q.min + '</span><span>均值位置 ' + Math.round(pos) + '%</span><span>' + q.max + '</span></div>';
            }
            return `
          <div class="card ${wide ? 'wide' : ''}">
            <h3><span class="tag">第 ${q.order} 题</span> ${esc(q.title)}
              <span class="small muted" style="font-weight:400">作答 ${q.answered} 人 · 作答率 ${q.response_rate}%</span></h3>
            ${inner}
          </div>`;
          })
          .join('') +
        '</div>';
    }

    async function load() {
      try {
        data = await api('/surveys/' + id + '/stats');
        renderStats();
      } catch (err) {
        document.getElementById('stats').innerHTML = '<div class="card"><p class="err">' + esc(err.message) + '</p></div>';
      }
    }

    document.getElementById('refresh').onclick = load;

    /** 与列表页相同的导出逻辑：下载链接无法带令牌，用 fetch + blob */
    document.getElementById('export-btn').onclick = async () => {
      try {
        const res = await fetch('/api/surveys/' + id + '/responses/export', {
          headers: { Authorization: 'Bearer ' + Auth.token() },
        });
        if (!res.ok) throw new Error('导出失败（HTTP ' + res.status + '）');
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '答卷-' + id.slice(-6) + '.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (err) {
        toast(err.message);
      }
    };

    document.getElementById('load-responses').onclick = async () => {
      try {
        const res = await api('/surveys/' + id + '/responses?size=20');
        const box = document.getElementById('responses');
        if (!res.items.length) {
          box.innerHTML = '<p class="muted">暂无答卷</p>';
          return;
        }
        box.innerHTML = res.items
          .map(
            (r) => `
          <div class="list-item" style="display:block">
            <div class="small muted">${fmtTime(r.submitted_at)} · ${r.anonymous ? '匿名填写' : '登录用户填写'}</div>
            <div style="margin-top:6px">
              ${r.answers
                .map(
                  (a) =>
                    '<div class="small">第 ' + a.question_order + ' 题 ' + esc(a.question_title) + '：<strong>' + esc(a.display || '（未作答）') + '</strong></div>'
                )
                .join('')}
            </div>
          </div>`
          )
          .join('');
      } catch (err) {
        document.getElementById('responses').innerHTML = '<p class="err">' + esc(err.message) + '</p>';
      }
    };

    load();
  </script>
</body>
</html>
