<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>编辑问卷</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23ffcd75%27/%3E%3Crect y=%275%27 width=%2716%27 height=%276%27 fill=%27%23d94040%27/%3E%3Crect y=%2711%27 width=%2716%27 height=%275%27 fill=%27%233b5bd9%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="nav">
    <div class="brand">问卷系统</div>
    <div class="links">
      <span class="user" id="user-chip" hidden><i id="user-initial">?</i><span id="who"></span></span>
      <a href="/dashboard.html">我的问卷</a>
      <a href="/bank.html">题目库</a>
      <a href="#" id="logout">退出</a>
    </div>
  </div>

  <div class="wrap wide">
    <div class="card">
      <div class="between">
        <div>
          <h2 id="survey-title">加载中…</h2>
          <p class="sub" id="survey-meta" style="margin-bottom:0"></p>
        </div>
        <div class="row" id="actions"></div>
      </div>
      <div id="status-banner" class="banner hidden" style="margin:14px 0 0">
        <span class="grow" id="status-text"></span>
      </div>
      <div class="row small" style="margin-top:12px">
        <span class="mono" id="share-url"></span>
        <button class="small" id="copy-link">复制填写链接</button>
        <a id="open-link" target="_blank"><button class="small">打开填写页</button></a>
      </div>
      <div class="err hidden" id="top-msg"></div>
    </div>

    <details class="panel" id="meta-panel">
      <summary>问卷设置 <span class="hint" id="meta-hint">标题、说明、截止时间与提交后提示语</span></summary>
      <div class="panel-body">
        <div class="between" style="margin-bottom:12px">
          <span class="small muted">改完记得点右侧按钮保存</span>
          <button class="primary small" id="save-meta">保存设置</button>
        </div>
        <label class="field"><span>标题</span><input type="text" id="meta-title" /></label>
        <label class="field"><span>说明</span><textarea id="meta-desc"></textarea></label>
        <div class="row" style="margin-bottom:12px">
          <label class="row" style="gap:6px"><input type="checkbox" id="meta-anon" /> 允许匿名填写</label>
          <label class="row" style="gap:6px"><input type="checkbox" id="meta-multi" /> 允许同一人多次填写</label>
        </div>
        <label class="field" style="max-width:300px">
          <span>截止时间（留空表示不限制）</span>
          <input type="datetime-local" id="meta-deadline" />
        </label>
        <label class="field">
          <span>提交后提示语（填写者提交答卷后看到的致谢文案）</span>
          <input type="text" id="meta-submit-msg" maxlength="200" placeholder="感谢你的填写！" />
        </label>
        <div class="err hidden" id="meta-msg"></div>
      </div>
    </details>

    <div class="card" id="q-card">
      <div class="between">
        <h2>题目列表 <span class="small muted" id="q-count" style="font-weight:400"></span></h2>
        <div class="row" style="gap:6px">
          <button class="small" id="bank-toggle">从题库选题</button>
          <button class="primary small" id="add-toggle">添加题目</button>
        </div>
      </div>

      <!-- 从题库选题弹窗 -->
      <div class="modal hidden" id="bank-modal">
        <div class="modal-box" style="max-width:560px">
          <div class="between" style="margin-bottom:12px">
            <h3 style="margin:0">从题库选题</h3>
            <button class="small" id="bank-close">✕</button>
          </div>
          <div class="row" style="gap:0;margin-bottom:8px">
            <button class="small" id="bank-tab-mine">我的题目</button>
            <button class="small" id="bank-tab-shared">共享给我的</button>
          </div>
          <div id="bank-list" style="max-height:360px;overflow:auto"><p class="muted">加载中…</p></div>
          <p class="small muted" style="margin-top:10px">选题后会复制一份快照加入本问卷；之后题库出新版本不影响本问卷。</p>
        </div>
      </div>

      <!-- 题目表单 -->
      <div id="q-form" class="hidden" style="border:2px solid var(--text);padding:16px;margin-top:14px;background:var(--bg-soft)">
        <div class="between" style="margin-bottom:10px">
          <strong id="q-form-title">添加题目</strong>
          <button class="small" id="q-form-cancel">收起</button>
        </div>
        <div class="row">
          <label class="field" style="width:160px">
            <span>题型</span>
            <select id="q-type">
              <option value="single">单选题</option>
              <option value="multiple">多选题</option>
              <option value="dropdown">下拉选择</option>
              <option value="rating">评分题（1~5 星）</option>
              <option value="text">文本填空</option>
              <option value="number">数字填空</option>
              <option value="date">日期</option>
            </select>
          </label>
          <label class="field grow">
            <span>题干</span>
            <input type="text" id="q-title" placeholder="例如：你的身份" />
          </label>
        </div>

        <div id="q-options-box">
          <label class="field">
            <span>选项（每行一个，可写成「A. 学生」，也可只写文字，系统自动编号）</span>
            <textarea id="q-options" placeholder="学生&#10;教师&#10;其他"></textarea>
          </label>
        </div>

        <div id="q-rating-hint" class="row hidden">
          <p class="small muted" style="margin:0">评分题固定为 1~5 星，无需配置选项；提交时保存所选星级。</p>
        </div>

        <div id="q-multi-box" class="row hidden">
          <label class="field" style="width:150px"><span>最少选择</span><input type="number" id="q-min-choice" min="0" /></label>
          <label class="field" style="width:150px"><span>最多选择</span><input type="number" id="q-max-choice" min="1" /></label>
        </div>

        <div id="q-text-box" class="row hidden">
          <label class="field" style="width:150px"><span>最少字数</span><input type="number" id="q-min-len" min="0" /></label>
          <label class="field" style="width:150px"><span>最多字数</span><input type="number" id="q-max-len" min="0" /></label>
        </div>

        <div id="q-number-box" class="row hidden">
          <label class="field" style="width:150px"><span>最小值</span><input type="number" id="q-min" /></label>
          <label class="field" style="width:150px"><span>最大值</span><input type="number" id="q-max" /></label>
          <label class="row" style="gap:6px;margin-top:16px"><input type="checkbox" id="q-integer" /> 必须是整数</label>
        </div>

        <label class="row" style="gap:6px;margin:4px 0 12px"><input type="checkbox" id="q-required" /> 必答题</label>
        <div class="row">
          <button class="primary" id="q-save">保存题目</button>
          <span class="muted small">保存后可在题目卡片里设置跳转规则</span>
        </div>
        <div class="err hidden" id="q-msg"></div>
      </div>

      <div id="questions" style="margin-top:16px"><p class="muted">加载中…</p></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const { Auth, api, esc, toast, fmtTime, statusTag } = App;
    if (!Auth.requireLogin()) throw new Error('redirect');

    const me = Auth.user() || {};
    document.getElementById('who').textContent = me.username || '';
    document.getElementById('user-initial').textContent = (me.username || '?').slice(0, 1).toUpperCase();
    document.getElementById('user-chip').hidden = false;

    const id = App.query('id');
    let survey = null;
    let questions = [];
    let editingId = null;
    let jumpOpenId = null;

    document.getElementById('logout').onclick = (e) => {
      e.preventDefault();
      Auth.clear();
      location.href = '/index.html';
    };

    const typeLabel = {
      single: '单选题', multiple: '多选题', text: '文本填空', number: '数字填空',
      dropdown: '下拉选择', rating: '评分题', date: '日期题',
    };

    function showTopErr(msg) {
      const box = document.getElementById('top-msg');
      box.textContent = msg || '';
      box.classList.toggle('hidden', !msg);
    }

    function parseOptions(text) {
      return text
        .split('\n')
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line, i) => {
          const m = line.match(/^([A-Za-z])[.、)．]\s*(.+)$/);
          if (m) return { key: m[1].toUpperCase(), label: m[2].trim() };
          return { key: String.fromCharCode(65 + i), label: line };
        });
    }

    function optionsToText(options) {
      return options.map((o) => o.key + '. ' + o.label).join('\n');
    }

    function renderHeader() {
      const tag = statusTag(survey.status);
      document.getElementById('survey-title').innerHTML = esc(survey.title) + ' ' + tag;
      document.getElementById('survey-meta').textContent =
        survey.question_count + ' 题 · 创建于 ' + fmtTime(survey.created_at) +
        (survey.deadline ? ' · 截止 ' + fmtTime(survey.deadline) : '');
      document.getElementById('share-url').textContent = survey.share_url;
      document.getElementById('open-link').href = survey.share_url;

      // 状态横幅：先说清「当前能做什么」，再让用户看按钮，减少点了才知道不行的情况
      const banner = document.getElementById('status-banner');
      const text = document.getElementById('status-text');
      const info = {
        draft: ['warn', '草稿状态：题目可以自由增删改。发布后题目结构即冻结——到时候要改题，请复制为新问卷。'],
        published: ['ok', '已发布：正在收集答卷，题目已冻结。现在仍可修改截止时间与提交后提示语。'],
        closed: ['mute', '已关闭：不再接收新答卷，问卷内容只读。'],
      }[survey.status];
      banner.className = 'banner ' + info[0];
      text.innerHTML = '<b>' + info[1].split('：')[0] + '：</b>' + info[1].split('：').slice(1).join('：');

      const actions = document.getElementById('actions');
      const btns = [];
      btns.push('<a href="/stats.html?id=' + id + '"><button class="small">查看统计</button></a>');
      if (survey.status === 'draft') btns.push('<button class="primary small" data-act="publish">发布问卷</button>');
      if (survey.status === 'published') btns.push('<button class="small danger" data-act="close">关闭问卷</button>');
      if (survey.status === 'draft') btns.push('<button class="small danger" data-act="delete">删除</button>');
      actions.innerHTML = btns.join(' ');

      actions.querySelectorAll('[data-act]').forEach((b) => {
        b.onclick = async () => {
          showTopErr('');
          try {
            if (b.dataset.act === 'publish') await api('/surveys/' + id + '/publish', { method: 'POST' });
            if (b.dataset.act === 'close') await api('/surveys/' + id + '/close', { method: 'POST' });
            if (b.dataset.act === 'delete') {
              if (!(await App.confirm('确认删除这份草稿问卷？题目会一并删除，且不可恢复。', { title: '删除草稿', okText: '删除', danger: true }))) return;
              await api('/surveys/' + id, { method: 'DELETE' });
              location.href = '/dashboard.html';
              return;
            }
            await load();
            toast('操作成功');
          } catch (err) {
            showTopErr(err.message);
          }
        };
      });
    }

    function renderMeta() {
      document.getElementById('meta-title').value = survey.title;
      document.getElementById('meta-desc').value = survey.description || '';
      document.getElementById('meta-anon').checked = survey.allow_anonymous;
      document.getElementById('meta-multi').checked = survey.allow_multiple;
      document.getElementById('meta-deadline').value = survey.deadline
        ? new Date(new Date(survey.deadline).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16)
        : '';
      document.getElementById('meta-submit-msg').value = survey.submit_message || '';
      document.getElementById('meta-hint').textContent =
        survey.status === 'draft' ? '标题、说明、截止时间与提交后提示语' : survey.status === 'published' ? '已发布：标题与说明已锁定' : '已关闭：全部只读';
      document.getElementById('q-count').textContent = '共 ' + survey.question_count + ' 题';
      const locked = survey.status !== 'draft';
      ['meta-title', 'meta-desc', 'meta-anon', 'meta-multi'].forEach((k) => {
        document.getElementById(k).disabled = locked;
      });
      // 提示语不影响答卷结构，发布后仍可修改；问卷关闭后后端不接受任何修改，按钮一并禁用
      document.getElementById('meta-submit-msg').disabled = survey.status === 'closed';
      document.getElementById('meta-deadline').disabled = survey.status === 'closed';
      document.getElementById('save-meta').disabled = survey.status === 'closed';
      if (survey.status === 'closed') {
        document.getElementById('meta-msg').classList.add('hidden');
      }
      // 题目结构发布后即冻结：加题入口一并收起，避免用户点了必然 409
      ['bank-toggle', 'add-toggle'].forEach((k) => {
        const el = document.getElementById(k);
        if (el) el.classList.toggle('hidden', survey.status !== 'draft');
      });
    }

    function ruleText(q, rule) {
      const w = rule.when || {};
      let cond = '';
      if (w.op === 'option_selected') {
        const opt = (q.options || []).find((o) => o.key === w.option_key);
        cond = '选择「' + (opt ? opt.label : w.option_key) + '」';
      } else if (w.op === 'number_eq') cond = '数值等于 ' + w.value;
      else if (w.op === 'number_gte') cond = '数值 ≥ ' + w.value;
      else if (w.op === 'number_lt') cond = '数值 < ' + w.value;
      else if (w.op === 'number_between') cond = '数值在 ' + w.value + ' ~ ' + w.value2;
      else if (w.op === 'text_contains') cond = '内容包含「' + w.text + '」';

      if (rule.to === 'end') return cond + ' → 结束问卷';
      const target = questions.find((x) => x.id === rule.target_question_id);
      return cond + ' → 跳到第 ' + (target ? target.order : '?') + ' 题';
    }

    function renderQuestions() {
      const box = document.getElementById('questions');
      if (!questions.length) {
        box.innerHTML =
          '<div class="empty">这份问卷还没有题目<br /><span class="small">加一道题，或从题库直接选题</span>' +
          '<div class="row" style="justify-content:center;margin-top:14px">' +
          (survey.status === 'draft' ? '<button class="small primary" id="empty-add">＋ 添加题目</button>' : '') +
          '</div></div>';
        const addBtn = document.getElementById('empty-add');
        if (addBtn) addBtn.onclick = () => openForm(null);
        return;
      }
      const editable = survey.status === 'draft';

      box.innerHTML = questions
        .map((q, i) => {
          const constraints = [];
          const c = q.constraints || {};
          if (q.type === 'multiple') {
            if (c.min_choice != null) constraints.push('最少选 ' + c.min_choice + ' 项');
            if (c.max_choice != null) constraints.push('最多选 ' + c.max_choice + ' 项');
          }
          if (q.type === 'text') {
            if (c.min_length != null) constraints.push('最少 ' + c.min_length + ' 字');
            if (c.max_length != null) constraints.push('最多 ' + c.max_length + ' 字');
          }
          if (q.type === 'number') {
            if (c.min != null) constraints.push('最小 ' + c.min);
            if (c.max != null) constraints.push('最大 ' + c.max);
            if (c.integer) constraints.push('必须为整数');
          }

          // 跳转规则原本每条占一行，题目多时把列表撑得很高；改为一行内用「；」分隔
          const rules = (q.jump_rules || [])
            .map(
              (r, ri) =>
                esc(ruleText(q, r)) +
                (editable ? ' <a href="#" data-del-rule="' + q.id + '" data-rule-i="' + ri + '" style="text-decoration:none">×</a>' : '')
            )
            .join('；');

          const jumpForm =
            jumpOpenId === q.id && editable
              ? `
            <div style="border:2px dashed var(--line-soft);padding:12px;margin-top:10px;background:#fff">
              <div class="row">
                <label class="field" style="width:190px"><span>条件</span>
                  <select data-jump-op="${q.id}">
                    ${['single', 'multiple', 'dropdown', 'rating'].includes(q.type) ? '<option value="option_selected">选择了某个选项</option>' : ''}
                    ${q.type === 'number' ? '<option value="number_gte">数值 ≥</option><option value="number_lt">数值 &lt;</option><option value="number_eq">数值 =</option><option value="number_between">数值在区间</option>' : ''}
                    ${q.type === 'text' ? '<option value="text_contains">内容包含关键字</option>' : ''}
                  </select>
                </label>
                <div id="jump-arg-${q.id}" class="row grow" style="align-items:flex-end"></div>
                <label class="field" style="width:190px"><span>动作</span>
                  <select data-jump-to="${q.id}">
                    ${questions
                      .filter((x) => x.order > q.order)
                      .map((x) => '<option value="' + x.id + '">跳到第 ' + x.order + ' 题</option>')
                      .join('')}
                    <option value="end">结束问卷</option>
                  </select>
                </label>
              </div>
              <button class="small primary" data-add-rule="${q.id}">添加规则</button>
            </div>`
              : '';

          return `
          <div class="q-item">
            <div class="no">${q.order}</div>
            <div class="body">
              <div class="t">${esc(q.title)}
                <span class="tag">${typeLabel[q.type]}${q.required ? ' · 必答' : ''}</span>
                ${q.bank_question_id ? '<span class="tag">题库题 v' + q.bank_version + '</span>' : ''}</div>
              <div class="preview">${
                q.type === 'rating'
                  ? '固定选项：1 星 ~ 5 星'
                  : q.type === 'date'
                    ? '填写者选择日期（YYYY-MM-DD）'
                    : q.options && q.options.length
                      ? q.options.map((o) => '<span class="opt-line">' + esc(o.key + '. ' + o.label) + '</span>').join('')
                      : '无选项'
              }</div>
              ${constraints.length ? '<div class="preview">约束：' + esc(constraints.join('，')) + '</div>' : ''}
              ${rules ? '<div class="jump">跳转：' + rules + '</div>' : ''}
              ${jumpForm}
            </div>
            ${
              editable
                ? `<div class="ops">
                      <button class="small" data-edit="${q.id}">编辑</button>
                      <button class="small" data-jump="${q.id}">跳转</button>
                      <div class="more">
                        <button class="small">更多 ▾</button>
                        <div class="more-list">
                          <button data-save-bank="${q.id}">存为常用题</button>
                          <button data-up="${q.id}" ${i === 0 ? 'disabled' : ''}>上移</button>
                          <button data-down="${q.id}" ${i === questions.length - 1 ? 'disabled' : ''}>下移</button>
                          <div class="sep"></div>
                          <button data-del="${q.id}" style="color:var(--danger)">删除本题</button>
                        </div>
                      </div>
                    </div>`
                : ''
            }
          </div>`;
        })
        .join('');

      box.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => openForm(b.dataset.edit)));
      box.querySelectorAll('[data-save-bank]').forEach((b) => (b.onclick = () => saveToBank(b.dataset.saveBank)));
      box.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => removeQuestion(b.dataset.del)));
      box.querySelectorAll('[data-jump]').forEach(
        (b) =>
          (b.onclick = () => {
            jumpOpenId = jumpOpenId === b.dataset.jump ? null : b.dataset.jump;
            renderQuestions();
            if (jumpOpenId) mountJumpArgs(jumpOpenId);
          })
      );
      box.querySelectorAll('[data-up]').forEach((b) => (b.onclick = () => move(b.dataset.up, -1)));
      box.querySelectorAll('[data-down]').forEach((b) => (b.onclick = () => move(b.dataset.down, 1)));
      box.querySelectorAll('[data-del-rule]').forEach(
        (b) => (b.onclick = (e) => {
          e.preventDefault();
          deleteRule(b.dataset.delRule, Number(b.dataset.ruleI));
        })
      );
      box.querySelectorAll('[data-add-rule]').forEach((b) => (b.onclick = () => addRule(b.dataset.addRule)));
      box.querySelectorAll('[data-jump-op]').forEach((s) => (s.onchange = () => mountJumpArgs(s.dataset.jumpOp)));
    }

    /** 根据条件类型渲染参数输入框 */
    function mountJumpArgs(qid) {
      const q = questions.find((x) => x.id === qid);
      const op = document.querySelector('[data-jump-op="' + qid + '"]').value;
      const box = document.getElementById('jump-arg-' + qid);
      if (op === 'option_selected') {
        box.innerHTML =
          '<label class="field grow"><span>选项</span><select data-arg="opt">' +
          q.options.map((o) => '<option value="' + esc(o.key) + '">' + esc(o.key + '. ' + o.label) + '</option>').join('') +
          '</select></label>';
      } else if (op === 'number_between') {
        box.innerHTML =
          '<label class="field" style="width:110px"><span>下界</span><input type="number" data-arg="v1" /></label>' +
          '<label class="field" style="width:110px"><span>上界</span><input type="number" data-arg="v2" /></label>';
      } else if (op === 'text_contains') {
        box.innerHTML = '<label class="field grow"><span>关键字</span><input type="text" data-arg="text" /></label>';
      } else {
        box.innerHTML = '<label class="field" style="width:130px"><span>数值</span><input type="number" data-arg="v1" /></label>';
      }
    }

    async function addRule(qid) {
      const q = questions.find((x) => x.id === qid);
      const op = document.querySelector('[data-jump-op="' + qid + '"]').value;
      const to = document.querySelector('[data-jump-to="' + qid + '"]').value;
      const arg = (name) => {
        const node = document.querySelector('#jump-arg-' + qid + ' [data-arg="' + name + '"]');
        return node ? node.value : '';
      };

      const when = { op };
      if (op === 'option_selected') when.option_key = arg('opt');
      if (op === 'number_between') {
        when.value = Number(arg('v1'));
        when.value2 = Number(arg('v2'));
      }
      if (op === 'number_gte' || op === 'number_lt' || op === 'number_eq') when.value = Number(arg('v1'));
      if (op === 'text_contains') when.text = arg('text');

      const rules = (q.jump_rules || []).concat([
        { when, to: to === 'end' ? 'end' : 'question', target_question_id: to === 'end' ? null : to, priority: (q.jump_rules || []).length },
      ]);

      try {
        await api('/questions/' + qid, { method: 'PATCH', body: { jump_rules: rules } });
        await load();
        toast('跳转规则已添加');
      } catch (err) {
        toast(err.message, 'err');
      }
    }

    async function deleteRule(qid, index) {
      const q = questions.find((x) => x.id === qid);
      const rules = (q.jump_rules || []).filter((_, i) => i !== index);
      try {
        await api('/questions/' + qid, { method: 'PATCH', body: { jump_rules: rules } });
        await load();
        toast('已删除规则');
      } catch (err) {
        toast(err.message, 'err');
      }
    }

    function toggleTypeFields() {
      const t = document.getElementById('q-type').value;
      const withOptions = t === 'single' || t === 'multiple' || t === 'dropdown';
      document.getElementById('q-options-box').classList.toggle('hidden', !withOptions);
      document.getElementById('q-rating-hint').classList.toggle('hidden', t !== 'rating');
      document.getElementById('q-multi-box').classList.toggle('hidden', t !== 'multiple');
      document.getElementById('q-text-box').classList.toggle('hidden', t !== 'text');
      document.getElementById('q-number-box').classList.toggle('hidden', t !== 'number');
    }
    document.getElementById('q-type').onchange = toggleTypeFields;

    function openForm(qid) {
      editingId = qid || null;
      const form = document.getElementById('q-form');
      form.classList.remove('hidden');
      document.getElementById('q-form-title').textContent = qid ? '编辑题目' : '添加题目';
      document.getElementById('q-msg').classList.add('hidden');

      const q = qid ? questions.find((x) => x.id === qid) : null;
      const type = q ? q.type : 'single';
      document.getElementById('q-type').value = type;
      document.getElementById('q-title').value = q ? q.title : '';
      document.getElementById('q-required').checked = q ? q.required : false;
      document.getElementById('q-options').value = q && q.options ? optionsToText(q.options) : '';
      const c = (q && q.constraints) || {};
      document.getElementById('q-min-choice').value = c.min_choice != null ? c.min_choice : '';
      document.getElementById('q-max-choice').value = c.max_choice != null ? c.max_choice : '';
      document.getElementById('q-min-len').value = c.min_length != null ? c.min_length : '';
      document.getElementById('q-max-len').value = c.max_length != null ? c.max_length : '';
      document.getElementById('q-min').value = c.min != null ? c.min : '';
      document.getElementById('q-max').value = c.max != null ? c.max : '';
      document.getElementById('q-integer').checked = Boolean(c.integer);
      toggleTypeFields();
      // 打开表单直接把光标放进题干，少一次点击
      form.scrollIntoView({ block: 'center', behavior: 'smooth' });
      document.getElementById('q-title').focus({ preventScroll: true });
    }

    document.getElementById('add-toggle').onclick = () => openForm(null);
    document.getElementById('q-form-cancel').onclick = () => document.getElementById('q-form').classList.add('hidden');

    // ── 从题库选题（第二阶段）──
    let bankScope = 'mine';
    async function loadBank() {
      const box = document.getElementById('bank-list');
      try {
        const data = await api('/bank-questions?scope=' + bankScope);
        if (!data.questions.length) {
          box.innerHTML = '<p class="muted">' + (bankScope === 'mine' ? '题库还是空的，可先在「题目库」页创建，或把本问卷的题「存为常用题」。' : '还没有人共享题目给你。') + '</p>';
          return;
        }
        box.innerHTML = data.questions
          .map(
            (q) => `
          <div class="list-item">
            <div class="grow">
              <div class="title"><span class="tag">v${q.version}</span> <strong>${esc(q.title)}</strong>
                <span class="small muted">（${typeLabel[q.type]}）</span></div>
              <div class="small muted">${
                q.type === 'rating' ? '1~5 星' : q.options && q.options.length ? q.options.map((o) => esc(o.label)).join(' / ') : '无选项'
              }</div>
            </div>
            <button class="small primary" data-use="${q.id}">选用</button>
          </div>`
          )
          .join('');
        box.querySelectorAll('[data-use]').forEach((b) => {
          b.onclick = async () => {
            try {
              await api('/surveys/' + id + '/questions', { method: 'POST', body: { bank_question_id: b.dataset.use } });
              document.getElementById('bank-modal').classList.add('hidden');
              await load();
              toast('已从题库添加题目');
            } catch (err) {
              toast(err.message, 'err');
            }
          };
        });
      } catch (err) {
        box.innerHTML = '<p class="err">' + esc(err.message) + '</p>';
      }
    }
    document.getElementById('bank-toggle').onclick = () => {
      document.getElementById('bank-modal').classList.remove('hidden');
      loadBank();
    };
    document.getElementById('bank-close').onclick = () => document.getElementById('bank-modal').classList.add('hidden');
    document.getElementById('bank-modal').onclick = (e) => {
      if (e.target.id === 'bank-modal') e.target.classList.add('hidden');
    };
    document.getElementById('bank-tab-mine').onclick = () => {
      bankScope = 'mine';
      loadBank();
    };
    document.getElementById('bank-tab-shared').onclick = () => {
      bankScope = 'shared';
      loadBank();
    };

    // 把问卷里的某道题保存为题库常用题（第二阶段需求①）
    async function saveToBank(qid) {
      try {
        await api('/bank-questions/from-question', { method: 'POST', body: { question_id: qid } });
        toast('已保存到题库，可在「题目库」页查看');
      } catch (err) {
        toast(err.message, 'err');
      }
    }

    document.getElementById('q-save').onclick = async (ev) => {
      const btn = ev.currentTarget;
      const msg = document.getElementById('q-msg');
      msg.classList.add('hidden');
      const type = document.getElementById('q-type').value;
      const body = {
        type,
        title: document.getElementById('q-title').value,
        required: document.getElementById('q-required').checked,
      };
      if (type === 'single' || type === 'multiple' || type === 'dropdown') {
        body.options = parseOptions(document.getElementById('q-options').value);
      }
      // rating（固定选项）与 date（无约束）不需要额外字段
      body.constraints = {};
      if (type === 'multiple') {
        body.constraints.min_choice = document.getElementById('q-min-choice').value || null;
        body.constraints.max_choice = document.getElementById('q-max-choice').value || null;
      }
      if (type === 'text') {
        body.constraints.min_length = document.getElementById('q-min-len').value || null;
        body.constraints.max_length = document.getElementById('q-max-len').value || null;
      }
      if (type === 'number') {
        body.constraints.min = document.getElementById('q-min').value === '' ? null : document.getElementById('q-min').value;
        body.constraints.max = document.getElementById('q-max').value === '' ? null : document.getElementById('q-max').value;
        body.constraints.integer = document.getElementById('q-integer').checked ? true : null;
      }

      try {
        App.busy(btn, true);
        if (editingId) await api('/questions/' + editingId, { method: 'PATCH', body });
        else await api('/surveys/' + id + '/questions', { method: 'POST', body });
        document.getElementById('q-form').classList.add('hidden');
        await load();
        toast('已保存');
        // 保存后把视角带到改动的那一行并闪一下，题目多时不用自己找
        const rows = document.querySelectorAll('#questions .q-item');
        const target = rows[rows.length - 1];
        if (target) {
          target.scrollIntoView({ block: 'center', behavior: 'smooth' });
          target.classList.add('flash');
          setTimeout(() => target.classList.remove('flash'), 1000);
        }
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove('hidden');
        msg.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } finally {
        App.busy(btn, false);
      }
    };

    async function removeQuestion(qid) {
      if (!(await App.confirm('确认删除这道题？已填写的答卷不受影响，但统计里不再出现该题。', { title: '删除题目', okText: '删除', danger: true }))) return;
      try {
        await api('/questions/' + qid, { method: 'DELETE' });
        await load();
        toast('已删除');
      } catch (err) {
        toast(err.message, 'err');
      }
    }

    async function move(qid, delta) {
      const idx = questions.findIndex((q) => q.id === qid);
      const target = idx + delta;
      if (target < 0 || target >= questions.length) return;
      const ids = questions.map((q) => q.id);
      [ids[idx], ids[target]] = [ids[target], ids[idx]];
      try {
        await api('/surveys/' + id + '/questions/order', { method: 'PUT', body: { question_ids: ids } });
        await load();
      } catch (err) {
        toast(err.message, 'err');
      }
    }

    document.getElementById('save-meta').onclick = async () => {
      const msg = document.getElementById('meta-msg');
      msg.classList.add('hidden');
      const deadlineVal = document.getElementById('meta-deadline').value;
      const body = { deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null };
      body.submit_message = document.getElementById('meta-submit-msg').value;
      if (survey.status === 'draft') {
        body.title = document.getElementById('meta-title').value;
        body.description = document.getElementById('meta-desc').value;
        body.allow_anonymous = document.getElementById('meta-anon').checked;
        body.allow_multiple = document.getElementById('meta-multi').checked;
      }
      try {
        await api('/surveys/' + id, { method: 'PATCH', body });
        await load();
        toast('设置已保存');
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove('hidden');
      }
    };

    document.getElementById('copy-link').onclick = () => App.copy(survey.share_url);

    async function load() {
      try {
        const data = await api('/surveys/' + id);
        survey = data.survey;
        questions = data.questions;
        renderHeader();
        renderMeta();
        renderQuestions();
      } catch (err) {
        showTopErr(err.message);
      }
    }

    load();
  </script>
</body>
</html>
